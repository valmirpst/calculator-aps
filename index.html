<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto Calculadora | APS</title>
  <link rel="shortcut icon" href="./src/assets/images/calculator.svg" type="image/x-icon" />
</head>

<body>
  <div id="app">
    <main class="calculadora">
      <section class="cabecalhoCalculadora">
        <div class="titulo-calculadora">
          <div class="mini-display">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
          <div class="caixa-nome-calculadora">
            <span>KK-402</span>
            <span class="complemento-nome-calculadora">CALCULADORA ELETRÔNICA</span>
          </div>
        </div>
        <div class="display-calculadora">
          <div class="display-interno">
            <div id="campoInformacao" class="mensagens-display">
              <div id="info_memoria"></div>
              <div id="sinal">
                <div class="minus-element"></div>
              </div>
              <div></div>
            </div>
            <div id="tela" class="digitos-display">0</div>
          </div>
        </div>
      </section>

      <section id="teclado" class="corpoCalculadora">
        <button value="on_ce" class="botao botao-vermelho botao-once">
          <span>ON</span>
          <div class="dash"></div>
          <span>CE</span>
        </button>

        <div class="botao-auxiliar">
          <span>MRC</span>
          <button value="memoria_read_clear" id="memoria_read_clear" class="botao botao-laranja"></button>
        </div>

        <div class="botao-auxiliar">
          <span>M-</span>
          <button value="memoria_menos" id="memoria_menos" class="botao botao-laranja"></button>
        </div>
        <div class="botao-auxiliar">
          <span>M+</span>
          <button value="memoria_mais" id="memoria_mais" class="botao botao-laranja"></button>
        </div>

        <button class="botao">OFF</button>
        <button value="square_root" class="botao square-root">
          <img src="./src/assets/images/square-root.svg" alt="Square Root">
        </button>
        <button value="percentage" class="botao"><img src="./src/assets/images/percentage.svg"
            alt="Percentage"></button>
        <button value="division" class="botao"><img src="./src/assets/images/division.svg" alt="Division"></button>

        <button class="botao">7</button>
        <button class="botao">8</button>
        <button class="botao">9</button>
        <button value="multiplication" class="botao"><img src="./src/assets/images/multiplication.svg"
            alt="Multiplication"></button>

        <button class="botao">4</button>
        <button class="botao">5</button>
        <button class="botao">6</button>
        <button value="subtracao" class="botao">
          <div class="minus-element"></div>
        </button>

        <button class="botao">1</button>
        <button class="botao">2</button>
        <button class="botao">3</button>
        <button value="botao_mais" class="botao botao-mais"><svg data-img="true" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 18" width="24" height="24">
            <title>plus</title>
            <path data-img="true" fill="var(--branco)" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
          </svg></button>

        <button class="botao">0</button>
        <button value="separador_decimal" class="botao">
          <div class="dot"></div>
        </button>
        <button value="botao_igual" class="botao equal">
          <div class="minus-element"></div>
          <div class="minus-element"></div>
        </button>
      </section>
    </main>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>

</html>
