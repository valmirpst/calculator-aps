<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Project | APS</title>
  </head>

  <body>
    <div id="app">
      <main class="calculator">
        <section class="calc-header">
          <div class="calc-title">
            <div class="mini-display">
              <div></div>
              <div></div>
              <div></div>
              <div></div>
            </div>
            <div class="calc-name-box">
              <span>KK-402</span>
              <span class="calc-name-complement">ELECTRONIC CALCULATOR</span>
            </div>
          </div>
          <div class="calc-display">
            <div class="inner-display">
              <div class="display-messages">
                <div>M</div>
                <div>-</div>
                <div>E</div>
              </div>
              <div class="display-digits">0</div>
            </div>
          </div>
        </section>

        <section class="calc-body">calc-body</section>
      </main>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
